# --- 設定 ---
settings:
  # フィードに残す期間(日)。これより古い記事は落とす
  retention_days: 14
  # 各出力RSSフィードの最大件数
  max_items: 100
  # feed.json に載せる最大件数(タイムラインUIのデータ源。日付順・保持期間内をまとめて出す)。
  # 購読38本での保持期間内は約660件。上限に当たると新しい順に丸められて古い方が落ちる
  json_max_items: 900
  # 1回のGemini呼び出しでスコアリングする記事数
  score_batch_size: 20
  # 使用するGeminiモデル (gemini-2.5-flash は新規ユーザーには提供終了。
  # 精度優先なら gemini-3.6-flash も可だが、実測で1バッチ数十秒かかり503も出る)
  gemini_model: gemini-3.5-flash-lite
  # thinkingの深さ。Gemini 3.x は "low" / "high" を受け付ける(未指定ならモデル既定)
  # gemini_thinking_level: low
  # 集約フィードのメタ情報
  site_url: https://otajisan.github.io/daily-feeds
  feed_title: daily-feeds
  feed_description: 日本語Tech記事とAI/LLM関連ニュースの集約フィード(Geminiによる注目度スコア付き)
  # フィード取得時のUser-Agent
  user_agent: daily-feeds/1.0 (+https://otajisan.github.io/daily-feeds)
