[project]
name = "daily-feeds"
version = "0.1.0"
description = "日本語Tech記事とAI/LLMニュースを集約し、Geminiで注目度をスコアリングして公開する"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "google-genai>=1.0",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
daily-feeds = "daily_feeds.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE は既存の `# noqa: BLE001` と整合させるために入れている
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "ARG", "BLE"]
