[project]
name = "daily-feeds"
version = "0.1.0"
description = "日本語Tech記事とAI/LLMニュースを集約し、Geminiで注目度をスコアリングして公開する"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "google-genai>=1.0",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[project.scripts]
daily-feeds = "daily_feeds.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# BLE は既存の `# noqa: BLE001` と整合させるために入れている
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "ARG", "BLE"]

[tool.ruff.lint.per-file-ignores]
# テストダブルは本物と同じシグネチャを持つ必要があり、pytest の fixture は
# 引数名で要求する。どちらも「使っていない引数」に見えるが消せない
"tests/**" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=daily_feeds --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    # スクリプトとして直接叩いたときの入口。エントリポイントは [project.scripts] 側
    'if __name__ == "__main__":',
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
no_implicit_optional = true
warn_unused_ignores = true
# 型注釈の無い関数を新たに増やさない。feedparser / google-genai の値を受ける引数だけは
# スタブが無く実際に Any なので、そう明示している
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# どちらも型スタブを配布していない
module = ["feedparser.*", "google.genai.*"]
ignore_missing_imports = true
